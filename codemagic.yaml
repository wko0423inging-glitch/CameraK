workflows:
  ios-workflow:
    name: iOS Build
    environment:
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branches:
        - main
    scripts:
      - name: Build iOS
        script: |
          cd $CM_BUILD_DIR
          xcodebuild -version
    artifacts:
      - build/**/*.ipa
      - build/**/*.app
    publishing:
      email:
        recipients:
          - wko0423inging@icloud.com
